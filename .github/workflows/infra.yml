# Richtet den Pocket-Concierge-Server ein, ändert ihn oder baut ihn ab.
#
# Nur manuell startbar (Actions → Infrastruktur → Run workflow) und nur für den
# Besitzer des Repos. Alle persönlichen Werte kommen aus Secrets und Variablen
# der GitHub-Umgebung "infra"; im Repo selbst steht nichts Persönliches.
# Details: infra/README.md

name: Infrastruktur

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Aktion"
        type: choice
        options: [preview, up, destroy]
        default: preview
      stack:
        description: "Pulumi-Stack (eine Instanz pro Stack)"
        type: string
        default: prod

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.inputs.stack }}
  cancel-in-progress: false

jobs:
  pulumi:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: infra
    defaults:
      run:
        working-directory: infra
    env:
      COMMAND: ${{ github.event.inputs.command }}
      STACK: ${{ github.event.inputs.stack }}
      # Zugang
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      # Persönliche Werte
      TAILSCALE_AUTHKEY: ${{ secrets.POCKET_CONCIERGE_TAILSCALE_AUTHKEY }}
      ROLE_REPOS: ${{ secrets.POCKET_CONCIERGE_ROLE_REPOS }}
      # Optionale Einstellungen (leer = Standard aus infra/settings.py)
      ROLES: ${{ vars.POCKET_CONCIERGE_ROLES }}
      ROLE_TYPES: ${{ vars.POCKET_CONCIERGE_ROLE_TYPES }}
      LOCATION: ${{ vars.POCKET_CONCIERGE_LOCATION }}
      SERVER_TYPE: ${{ vars.POCKET_CONCIERGE_SERVER_TYPE }}
      BACKUPS: ${{ vars.POCKET_CONCIERGE_BACKUPS }}
      SWAP_GB: ${{ vars.POCKET_CONCIERGE_SWAP_GB }}
      REPO_REF: ${{ vars.POCKET_CONCIERGE_REPO_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulumi und Abhängigkeiten installieren
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          python -m venv venv
          venv/bin/pip install -q -r requirements.txt pytest

      - name: Tests
        run: venv/bin/python -m pytest -q

      - name: Pflichtwerte prüfen
        run: |
          missing=()
          [ -n "$HCLOUD_TOKEN" ] || missing+=("Secret HCLOUD_TOKEN")
          [ -n "$PULUMI_ACCESS_TOKEN$PULUMI_BACKEND_URL" ] || missing+=("Secret PULUMI_ACCESS_TOKEN oder Variable PULUMI_BACKEND_URL")
          [ -n "$TAILSCALE_AUTHKEY" ] || missing+=("Secret POCKET_CONCIERGE_TAILSCALE_AUTHKEY")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Fehlt in der Umgebung "infra": %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Stack und Konfiguration
        run: |
          if [ -n "$PULUMI_BACKEND_URL" ]; then pulumi login "$PULUMI_BACKEND_URL"; else pulumi login; fi
          pulumi stack select --create "$STACK"

          set_opt() { if [ -n "$2" ]; then pulumi config set "pocket-concierge:$1" -- "$2"; else pulumi config rm "pocket-concierge:$1" 2>/dev/null || true; fi; }
          pulumi config set pocket-concierge:repoUrl -- "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          pulumi config set --secret pocket-concierge:tailscaleAuthKey -- "$TAILSCALE_AUTHKEY"
          if [ -n "$ROLE_REPOS" ]; then pulumi config set --secret pocket-concierge:roleRepos -- "$ROLE_REPOS"; else pulumi config rm pocket-concierge:roleRepos 2>/dev/null || true; fi
          set_opt roles "$ROLES"
          set_opt roleTypes "$ROLE_TYPES"
          set_opt location "$LOCATION"
          set_opt serverType "$SERVER_TYPE"
          set_opt backups "$BACKUPS"
          set_opt swapGb "$SWAP_GB"
          set_opt repoRef "$REPO_REF"

      - name: Pulumi ${{ github.event.inputs.command }}
        run: |
          case "$COMMAND" in
            preview) pulumi preview --diff ;;
            # Server-Adressen sind Secrets und erscheinen hier nur maskiert.
            # Abrufen lokal mit: pulumi stack output --show-secrets
            # oder in der Hetzner-Konsole.
            up)      pulumi up --yes --diff ;;
            destroy) pulumi destroy --yes ;;
            *) echo "Unbekannte Aktion: $COMMAND"; exit 1 ;;
          esac
